name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'timrichardson/sidebar-git-diff' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Determine the next version
        id: version
        shell: bash
        run: |
          version=$(npm view sidebar-git-diff@latest version gitHead --json --prefer-online \
            | npm run --silent release:next)
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check and publish the release
        if: steps.version.outputs.value != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm ci --ignore-scripts
          npm version "$VERSION" --allow-same-version --no-git-tag-version --ignore-scripts
          npm run check
          npm publish --ignore-scripts --access public --tag latest
